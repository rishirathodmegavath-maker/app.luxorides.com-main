name: Build and Push App Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract commit SHA
        id: vars
        run: echo "SHA_TAG=${GITHUB_SHA::12}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/urvindia/luxorides-app:latest \
            -t ghcr.io/urvindia/luxorides-app:${{ steps.vars.outputs.SHA_TAG }} \
            .

      - name: Push image
        run: |
          docker push ghcr.io/urvindia/luxorides-app:latest
          docker push ghcr.io/urvindia/luxorides-app:${{ steps.vars.outputs.SHA_TAG }}
